apiVersion: v1
kind: Service
metadata:
  name: {{ include "three-tier-app.fullname" . }}-postgres
  namespace: {{ .Values.namespace.name }}
  labels:
    app: postgres
    {{- include "three-tier-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.postgres.service.type }}
  selector:
    app: postgres
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.targetPort }}
