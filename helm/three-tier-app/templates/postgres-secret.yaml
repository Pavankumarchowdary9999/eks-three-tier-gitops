apiVersion: v1
kind: Secret
metadata:
  name: {{ include "three-tier-app.fullname" . }}-postgres
  namespace: {{ .Values.namespace.name }}
  labels:
    app: postgres
    {{- include "three-tier-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "postgres.secret.DB_PASSWORD is required" .Values.postgres.secret.DB_PASSWORD }}
